<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hareket Oyunları</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Hareket Oyunları — MediaPipe Pose ile 5 çocuk oyunu
   Ortak sinyaller: zıpla, çömel, yerinde koş, kanat çırp, kol açıları, hareket miktarı
   Oyunlar: Dinozor Koşusu, Zıpzıp Macerası, Şekil Duvarı, Kuş Uçuşu, Donma Dansı */
:root{--ink:#1b2a4a;--accent:#ff4f7a;--sun:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#5ec8ff;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink)}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.hud[hidden],.msg[hidden],.screen[hidden]{display:none}
.pill{background:#fff;border-radius:999px;padding:4px 18px;font-size:clamp(20px,3vw,32px);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap}
.hud button{pointer-events:auto;border:0;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:8px 18px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:16px;font-size:clamp(18px,2.6vw,28px);font-weight:700;text-align:center;max-width:92vw}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(27,42,74,.35);padding:16px;overflow:auto}
.card{background:#fff;border-radius:28px;padding:clamp(18px,3.5vw,36px);max-width:780px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15)}
h1{margin:0 0 4px;font-size:clamp(36px,6vw,58px);line-height:1.05;color:var(--accent)}
p{margin:6px 0 12px;font-size:18px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.game{border:4px solid #e3edf7;border-radius:20px;padding:12px 14px;background:#f6fbff;cursor:pointer;font:inherit;text-align:left;color:var(--ink);min-height:44px;display:flex;gap:12px;align-items:flex-start}
.game:hover{border-color:var(--accent)}
.opt[aria-pressed=true]{border-color:var(--accent);background:#fff0f4}
.game:disabled{opacity:.6;cursor:wait}
.game b{display:block;font-size:22px;line-height:1.15}
.game span{font-size:15px;line-height:1.35}
.dot{flex:none;width:20px;height:20px;border-radius:50%;margin-top:5px}
.go{border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-size:26px;font-weight:800;padding:8px 40px;margin:6px;cursor:pointer;box-shadow:0 6px 0 #c42a52;min-height:44px}
.go.alt{background:#4d6bff;box-shadow:0 6px 0 #2f47c2}
.go:active{transform:translateY(4px);box-shadow:none}
.note{font-size:14px;opacity:.75;margin:10px 0 0}
.note a{color:var(--ink)}
button:focus-visible,a:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="cam" playsinline muted></video>

<div class="hud" id="hud" hidden>
  <div class="pill" id="score">Puan: 0</div>
  <button id="toMenu" type="button">Oyunlar</button>
  <div class="pill" id="time">60</div>
</div>
<div class="msg" id="msg" hidden></div>

<div class="screen" id="menu">
  <div class="card">
    <h1>Hareket Oyunları</h1>
    <p>Bir oyun seç, kameranın 2–3 adım önüne geç ve vücudunla oyna!</p>
    <div class="games">
      <button class="game" data-game="balloon"><i class="dot" style="background:#ff4f7a"></i><div><b>Balon Avı</b><span>Düşen balonları parmağındaki ya da şapkandaki iğneyle patlat.</span></div></button>
      <button class="game" data-game="dino"><i class="dot" style="background:#3fbf5a"></i><div><b>Dinozor Koşusu</b><span>Zıplayarak kaktüslerin üstünden atla, çömelerek arıların altından geç.</span></div></button>
      <button class="game" data-game="plat"><i class="dot" style="background:#9b5cff"></i><div><b>Zıpzıp Macerası</b><span>Yerinde koşunca ilerle, zıplayarak boşluklardan geç, altınları topla.</span></div></button>
      <button class="game" data-game="wall"><i class="dot" style="background:#e86a4a"></i><div><b>Şekil Duvarı</b><span>Duvardaki şekli kollarınla yap, delikten geç.</span></div></button>
      <button class="game" data-game="bird"><i class="dot" style="background:#4da3ff"></i><div><b>Kuş Uçuşu</b><span>Kollarını kanat gibi çırp, kuleler arasından uç.</span></div></button>
      <button class="game" data-game="lion"><i class="dot" style="background:#e8a33d"></i><div><b>Aslan Bakıyor</b><span>Aslan arkasını dönünce yerinde koşarak yaklaş, bakınca don. Kıpırdayan elenir!</span></div></button>
      <button class="game" data-game="keeper"><i class="dot" style="background:#43a047"></i><div><b>Kaleci</b><span>Sana gelen şutları ellerinle ya da vücudunla kurtar.</span></div></button>
      <button class="game" data-game="fruit"><i class="dot" style="background:#e63946"></i><div><b>Meyve Kılıcı</b><span>Elindeki kılıcı hızla savur, havaya fırlayan meyveleri kes.</span></div></button>
      <button class="game" data-game="dance"><i class="dot" style="background:#ffb627"></i><div><b>Donma Dansı</b><span>Müzik çalınca dans et, müzik durunca heykel gibi don.</span></div></button>
    </div>
    <p class="note">Görüntü cihazdan çıkmaz, her şey tarayıcıda işlenir. Kamera yoksa klavyeyle denenebilir: Boşluk zıpla/çırp, ↓ çömel, → koş; balonlar fareyle de patlar.</p>
  </div>
</div>

<div class="screen" id="bopts" hidden>
  <div class="card">
    <h1>Balon Avı</h1>
    <div class="games" role="group" aria-label="Görünüm">
      <button class="game opt" data-bmode="char" aria-pressed="true"><div><b>Karakter</b><span>Seni bir çizgi karakter taklit eder</span></div></button>
      <button class="game opt" data-bmode="self" aria-pressed="false"><div><b>Benim görüntüm</b><span>Sen oyunun içindesin</span></div></button>
    </div>
    <div class="games" role="group" aria-label="Kontrol">
      <button class="game opt" data-bctrl="hand" aria-pressed="true"><div><b>İşaret parmağı</b><span>Parmağındaki iğneyle patlat</span></div></button>
      <button class="game opt" data-bctrl="head" aria-pressed="false"><div><b>Kafa</b><span>Şapkandaki iğneyle patlat</span></div></button>
    </div>
    <div class="games" role="group" aria-label="Zorluk">
      <button class="game opt" data-bdiff="easy" aria-pressed="true"><div><b>Kolay</b><span>Yavaş ve büyük balonlar</span></div></button>
      <button class="game opt" data-bdiff="normal" aria-pressed="false"><div><b>Normal</b><span>Daha hızlı balonlar</span></div></button>
    </div>
    <button class="go" id="bstart">Başla</button>
    <button class="go alt" id="bback">Geri</button>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div class="card">
    <h1>Süper!</h1>
    <p id="result">0 puan</p>
    <button class="go" id="again">Tekrar oyna</button>
    <button class="go alt" id="back">Oyunlar</button>
  </div>
</div>

<script type="module">
import {FilesetResolver, PoseLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
{
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const ROUND = 60;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d'), video = $('cam');
let W = 0, H = 0, U = 60;
function resize(){ const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; U = Math.min(W, H)*.11; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', resize); resize();

/* ================= SES ================= */
let ac = null, noiseBuf = null;
function note(f, t, d, type, vol){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfx(f1, f2, dur, type = 'triangle', vol = .2){
  if(!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
const SND = {
  jump: () => sfx(300, 700, .18),
  coin: () => sfx(900, 1500, .12, 'square', .1),
  hit:  () => sfx(220, 90, .3, 'sawtooth', .12),
  flap: () => sfx(420, 260, .1, 'sine', .15),
  good: () => { sfx(520, 1040, .15); setTimeout(() => sfx(780, 1560, .2), 120); }
};
function hat(t){
  if(!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate*.05, ac.sampleRate); const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const s = ac.createBufferSource(), g = ac.createGain(), hp = ac.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 6000; s.buffer = noiseBuf;
  g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
  s.connect(hp).connect(g).connect(ac.destination); s.start(t);
}
const MEL = [0,4,7,4, 9,7,4,2, 0,4,7,12, 11,7,9,null, 5,9,12,9, 7,4,2,4, 0,2,4,7, 4,2,0,null];
const BASS = [0, 5, 7, 0];
const music = {
  on:false, timer:null, next:0, step:0,
  start(){ if(!ac || this.on) return; this.on = true; this.next = ac.currentTime + .05; this.step = 0; this.timer = setInterval(() => this.tick(), 40); },
  stop(){ this.on = false; clearInterval(this.timer); this.timer = null; },
  tick(){
    const sd = 60/128/2;
    while(this.next < ac.currentTime + .15){
      const s = this.step, t = this.next, n = MEL[s];
      if(n !== null) note(523*2**(n/12), t, sd*.9, 'square', .05);
      if(s % 4 === 0) note(131*2**(BASS[(s >> 3) % 4]/12), t, sd*1.8, 'triangle', .2);
      if(s % 2 === 1) hat(t);
      this.next += sd; this.step = (s + 1) % 32;
    }
  }
};

/* ================= KAMERA + POZ ================= */
let landmarker = null, camOK = false, lms = null, lastVT = -1, asp = 4/3, note2 = '';
async function initCam(){
  const s = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640}, height:{ideal:480}, facingMode:'user'}, audio:false});
  video.srcObject = s; await video.play(); camOK = true;
}
async function initPose(){
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opts = d => ({baseOptions:{modelAssetPath:MODEL, delegate:d}, runningMode:'VIDEO', numPoses:1,
    outputSegmentationMasks:true, minPoseDetectionConfidence:.4, minPosePresenceConfidence:.4, minTrackingConfidence:.4});
  try { landmarker = await PoseLandmarker.createFromOptions(fs, opts('GPU')); }
  catch(e){ landmarker = await PoseLandmarker.createFromOptions(fs, opts('CPU')); }
}
function detect(){
  if(!landmarker || !camOK || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  landmarker.detectForVideo(video, performance.now(), res => {
    lms = (res.landmarks && res.landmarks[0]) || null;
    const m = res.segmentationMasks && res.segmentationMasks[0];
    if(m && curKey === 'balloon' && bopt.mode === 'self' && phase !== 'menu') buildCut(m);
  });
}
/* S: aynalanmış, en-boy düzeltilmiş, yumuşatılmış noktalar (x: 0..asp, y: 0..1); P: bir önceki kare */
const S = Array.from({length:33}, () => ({x:0, y:0, v:0}));
const P = Array.from({length:33}, () => ({x:0, y:0}));
let sOn = false;
function smooth(){
  if(!lms){ sOn = false; return; }
  asp = (video.videoWidth || 640)/(video.videoHeight || 480);
  for(let i = 0; i < 33; i++){
    const l = lms[i], s = S[i], x = (1 - l.x)*asp, y = l.y;
    if(!sOn){ s.x = x; s.y = y; } else { s.x += (x - s.x)*.6; s.y += (y - s.y)*.6; }
    if(!sOn){ P[i].x = s.x; P[i].y = s.y; }
    s.v = l.visibility ?? 1;
  }
  sOn = true;
}
const ok = (i, th = .5) => sOn && S[i].v > th;
const ang = (a, b) => (Math.atan2(b.y - a.y, b.x - a.x)*180/Math.PI + 360) % 360;
const adiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

/* ================= ORTAK HAREKET SİNYALLERİ ================= */
const MOT = [0,11,12,13,14,15,16,23,24,25,26];
const sig = {ok:false, sw:.3, base:null, calib:false, dy:0, armed:true, jump:false, duck:false,
  runE:0, run:0, flapArmed:false, flap:false, motion:0, aL:0, aR:0, armsOK:false, L:[11,13,15], R:[12,14,16]};
const keys = {};
let kJump = false;
addEventListener('keydown', e => {
  if(['Space','ArrowUp','ArrowDown','ArrowRight'].includes(e.code) && phase !== 'menu') e.preventDefault();
  if(!keys[e.code] && (e.code === 'Space' || e.code === 'ArrowUp')) kJump = true;
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
const ptr = {x:0, y:0, on:false};
cv.addEventListener('pointerdown', e => { kJump = true; ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; });
cv.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; });
cv.addEventListener('pointerup', e => { if(e.pointerType !== 'mouse') ptr.on = false; });
cv.addEventListener('pointerleave', () => { ptr.on = false; });

function signals(dt){
  sig.jump = false; sig.flap = false;
  sig.ok = ok(11) && ok(12);
  if(sig.ok){
    const sw = Math.hypot(S[11].x - S[12].x, S[11].y - S[12].y);
    sig.sw += (sw - sig.sw)*Math.min(1, dt*2);
    const smy = (S[11].y + S[12].y)/2;
    if(sig.base === null) sig.base = smy;
    else if(sig.calib) sig.base += (smy - sig.base)*Math.min(1, dt*4);
    sig.dy = (smy - sig.base)/sig.sw;
    if(!sig.calib && Math.abs(sig.dy) < .12) sig.base += (smy - sig.base)*Math.min(1, dt*.8);
    // zıpla (omuzlar aniden yükselir) / çömel (omuzlar aşağıda)
    if(sig.armed && sig.dy < -.28){ sig.jump = true; sig.armed = false; }
    if(sig.dy > -.1) sig.armed = true;
    sig.duck = sig.dy > .45;
    // yerinde koşu: dizler (görünmüyorsa bilekler) ne kadar inip kalkıyor
    const idx = ok(25) && ok(26) ? [25,26] : [15,16];
    let e = 0, n = 0;
    for(const i of idx) if(ok(i, .4)){ e += Math.abs(S[i].y - P[i].y)/dt; n++; }
    e = n ? e/n/sig.sw*2 : 0;
    sig.runE += (e - sig.runE)*Math.min(1, dt*3);
    sig.run = Math.max(0, Math.min(1, (sig.runE - 1)/4));
    // kanat çırpma: bilekler omuz üstünden aşağı iner
    if(ok(15, .4) && ok(16, .4)){
      const ay = ((S[15].y + S[16].y)/2 - smy)/sig.sw;
      if(ay < 0) sig.flapArmed = true;
      else if(sig.flapArmed && ay > .5){ sig.flap = true; sig.flapArmed = false; }
    }
    // genel hareket miktarı (omuz genişliği / saniye)
    let m = 0, k = 0;
    for(const i of MOT) if(ok(i)){ m += Math.hypot(S[i].x - P[i].x, S[i].y - P[i].y); k++; }
    const mr = k ? m/k/dt/sig.sw : 0;
    sig.motion += (mr - sig.motion)*Math.min(1, dt*5);
    // kol açıları (ekranın solundaki ve sağındaki kol)
    sig.L = S[11].x < S[12].x ? [11,13,15] : [12,14,16];
    sig.R = sig.L[0] === 11 ? [12,14,16] : [11,13,15];
    sig.armsOK = ok(sig.L[2], .4) && ok(sig.R[2], .4);
    sig.aL = ang(S[sig.L[0]], S[sig.L[2]]); sig.aR = ang(S[sig.R[0]], S[sig.R[2]]);
  } else { sig.runE *= .9; sig.run = 0; sig.motion = 0; sig.duck = false; sig.armsOK = false; }
  for(let i = 0; i < 33; i++){ P[i].x = S[i].x; P[i].y = S[i].y; }
  if(kJump){ sig.jump = true; sig.flap = true; kJump = false; }
  if(keys.ArrowDown) sig.duck = true;
  if(keys.ArrowRight) sig.run = 1;
}

/* ================= ORTAK EFEKTLER ================= */
let parts = [], texts = [];
function burst(x, y, col, n = 16){
  for(let i = 0; i < n; i++){ const a = Math.random()*6.28, sp = 120 + Math.random()*260; parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:.8, c:i % 3 ? col : '#fff'}); }
}
function float(x, y, t){ texts.push({x, y, t, life:1.1}); }
function fx(dt){
  for(const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 600*dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for(const x of texts){ x.y -= 50*dt; x.life -= dt; }
  texts = texts.filter(x => x.life > 0);
}
function outlined(t, x, y, size, fill){
  ctx.font = `800 ${size}px "Baloo 2",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size/7); ctx.strokeStyle = '#1b2a4a'; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function drawFx(){
  for(const p of parts){ ctx.globalAlpha = Math.max(0, p.life/.8); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill(); }
  for(const x of texts){ ctx.globalAlpha = Math.min(1, x.life*2); outlined(x.t, x.x, x.y, 38, '#fff'); }
  ctx.globalAlpha = 1;
}
function circle(x, y, r, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, col, rot = 0){ ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }
function rrect(x, y, w, h, r, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function sky(c1, c2){ const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function cloud(x, y, k){
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath();
  for(const [dx, dy, r] of [[0,0,30],[34,-12,36],[70,0,28],[36,10,30]]){ ctx.moveTo(x + dx*k + r*k, y + dy*k); ctx.arc(x + dx*k, y + dy*k, r*k, 0, 7); }
  ctx.fill();
}
function clouds(t, off = 0){ for(let i = 0; i < 4; i++){ const x = ((i*0.29*(W + 300) - off*(.2 + i*.05) + t*12*(i + 1)) % (W + 300) + W + 300) % (W + 300) - 150; cloud(x, H*(.08 + i*.06), .7 + (i % 2)*.4); } }
const overlap = (a, b, s) => a.x + s < b.x + b.w - s && a.x + a.w - s > b.x + s && a.y + s < b.y + b.h - s && a.y + a.h - s > b.y + s;

/* çocuğun kendi çöp adamı (Şekil Duvarı ve Donma Dansı) */
function drawFigure(cx, cy, k, lw, body, armL, armR){
  if(!sOn) return;
  const mx = (S[11].x + S[12].x)/2, my = (S[11].y + S[12].y)/2;
  const p = i => ({x:cx + (S[i].x - mx)*k, y:cy + (S[i].y - my)*k});
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = lw;
  const line = (A, B, col) => { ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke(); };
  const seg = (a, b, col) => { if(ok(a, .4) && ok(b, .4)) line(p(a), p(b), col); };
  const hipOK = ok(23, .4) && ok(24, .4);
  const hm = hipOK ? {x:(p(23).x + p(24).x)/2, y:(p(23).y + p(24).y)/2} : {x:cx, y:cy + sig.sw*k*1.4};
  line({x:cx, y:cy}, hm, body);
  seg(11, 12, body);

/* ================= OYUN 2: ZIPZIP MACERASI ================= */
const plat = {
  title:'Zıpzıp Macerası', hint:'Yerinde koş, zıplayarak boşluklardan geç!',
  reset(){ this.x = 0; this.y = 0; this.vy = 0; this.vx = 0; this.gaps = []; this.coins = []; this.snails = []; this.genX = W*.9; this.blink = 0; this.step = 0; },
  inGap(x){ return this.gaps.some(g => x > g.x0 + U*.15 && x < g.x1 - U*.15); },
  gen(){
    const u = U;
    while(this.genX < this.x + W*1.6){
      const flat = u*(3 + Math.random()*4);
      if(Math.random() < .5){ const y = -u*(1.5 + Math.random()*.4); for(let k = 0; k < 3; k++) this.coins.push({x:this.genX + flat*.3 + k*u*.8, y}); }
      if(Math.random() < .35) this.snails.push({x:this.genX + flat*.6, dir:-1, x0:this.genX + u, x1:this.genX + flat - u});
      this.genX += flat;
      if(Math.random() < .65){
        const gw = u*(1.1 + Math.random()*.7);
        this.gaps.push({x0:this.genX, x1:this.genX + gw});
        for(let k = 0; k < 3; k++){ const f = (k + .5)/3; this.coins.push({x:this.genX + gw*f, y:-u*(1.3 + Math.sin(f*Math.PI)*.8)}); }
        this.genX += gw;
      }
    }
  },
  update(dt){
    const u = U, g = 22*u, maxV = W*.36;
    this.gen();
    const onG = this.y >= 0 && this.y < u*.05 && !this.inGap(this.x);
    const target = phase === 'play' ? sig.run*maxV : 0;
    if(onG) this.vx += (target - this.vx)*Math.min(1, dt*4);
    if(sig.jump && onG && phase === 'play'){ this.vy = -9*u; this.vx = Math.max(this.vx, maxV*.55); SND.jump(); }
    if(this.y > u*.3) this.vx = 0;
    this.x += this.vx*dt; this.vy += g*dt; this.y += this.vy*dt;
    if(!this.inGap(this.x) && this.y > 0 && this.y < u*.6){ this.y = 0; this.vy = 0; }
    if(this.y > H*.35){
      const gp = this.gaps.find(gp => gp.x0 - u < this.x && gp.x1 + u > this.x);
      this.x = (gp ? gp.x0 : this.x) - u*.8; this.y = 0; this.vy = 0; this.vx = 0; this.blink = 1.2; SND.hit();
    }
    this.step += this.vx*dt/u;
    for(const c of this.coins){
      if(!c.got && Math.abs(c.x - this.x) < u*.6 && Math.abs(c.y - (this.y - u*.5)) < u*.7){ c.got = true; score++; SND.coin(); }
    }
    for(const s of this.snails){
      s.x += s.dir*u*.6*dt; if(s.x < s.x0){ s.x = s.x0; s.dir = 1; } if(s.x > s.x1){ s.x = s.x1; s.dir = -1; }
      if(s.dead || this.blink > 0 || Math.abs(s.x - this.x) > u*.7) continue;
      if(this.y < -u*.35 && this.vy > 0){ s.dead = true; score += 2; this.vy = -6*u; SND.good(); burst(s.x - (this.x - W*.3), H*.78 - u*.3, '#ff9f43', 10); }
      else if(this.y > -u*.5){ this.blink = 1.2; this.x -= u*.9; this.vx = 0; SND.hit(); }
    }
    const behind = this.x - W;
    this.coins = this.coins.filter(c => !c.got && c.x > behind);
    this.snails = this.snails.filter(s => !s.dead && s.x > behind);
    this.gaps = this.gaps.filter(g => g.x1 > behind);
    this.blink = Math.max(0, this.blink - dt);
  },
  draw(t){
    const u = U, gy = H*.78, cam = this.x - W*.3, sx = x => x - cam;
    sky('#5ec8ff', '#d9f5ff');
    clouds(t, cam);
    ctx.fillStyle = '#9adf8a';
    for(let i = -1; i < 5; i++){ const hx = ((i*W*.4 - cam*.3) % (W*1.6) + W*1.6) % (W*1.6) - W*.3; ctx.beginPath(); ctx.ellipse(hx, gy, W*.25, H*.22, 0, Math.PI, 0); ctx.fill(); }
    let start = cam - u;
    const ground = (a, b) => { if(b <= a) return; rrect(sx(a), gy, b - a, H - gy, 0, '#c9844a'); rrect(sx(a), gy, b - a, u*.25, 0, '#5cc443'); };
    for(const gp of this.gaps){ if(gp.x1 < cam - u || gp.x0 > cam + W + u) continue; ground(start, gp.x0); start = Math.max(start, gp.x1); }
    ground(start, cam + W + u);
    for(const c of this.coins){ const w = Math.abs(Math.cos(t*4 + c.x*.01)); ell(sx(c.x), gy + c.y, u*.25*Math.max(.25, w), u*.25, '#ffc93c'); ell(sx(c.x), gy + c.y, u*.12*Math.max(.25, w), u*.14, '#ffe58a'); }
    for(const s of this.snails){

      circle(x + s.dir*u*.38, y - u*.3, u*.06, '#1b2a4a');
      ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + s.dir*u*.3, y - u*.15); ctx.lineTo(x + s.dir*u*.38, y - u*.3); ctx.stroke();
      circle(x - s.dir*u*.05, y - u*.38, u*.3, '#ff9f43');
      ctx.strokeStyle = '#c96a1c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x - s.dir*u*.05, y - u*.38, u*.15, 0, 5); ctx.stroke();
    }
    if(this.blink > 0 && Math.floor(this.blink*10) % 2) ctx.globalAlpha = .35;
    const hx = W*.3, hy = gy + this.y, ph = Math.sin(this.step*3);
    ell(hx - u*.2, hy - u*.05 - (this.vx > 10 ? Math.max(0, ph)*u*.12 : 0), u*.18, u*.09, '#5a2fb0');
    ell(hx + u*.2, hy - u*.05 - (this.vx > 10 ? Math.max(0, -ph)*u*.12 : 0), u*.18, u*.09, '#5a2fb0');
    circle(hx, hy - u*.55, u*.5, '#9b5cff');
    ell(hx, hy - u*.38, u*.3, u*.22, '#c9a6ff');
    ctx.strokeStyle = '#5a2fb0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hx, hy - u*1.03); ctx.quadraticCurveTo(hx + u*.15, hy - u*1.3, hx + u*.05, hy - u*1.4); ctx.stroke();
    circle(hx + u*.05, hy - u*1.42, u*.09, '#ff4f7a');
    for(const ex of [-.17, .2]){ circle(hx + ex*u, hy - u*.68, u*.13, '#fff'); circle(hx + ex*u + u*.04, hy - u*.67, u*.07, '#1b2a4a'); }
    ctx.globalAlpha = 1;
  }
};

/* ================= OYUN 3: ŞEKİL DUVARI ================= */
const POSES = [
  {n:'T harfi ol!', L:180, R:0}, {n:'Y harfi ol!', L:225, R:315}, {n:'Kollar yukarı!', L:270, R:270},
  {n:'Bir kol yukarı!', L:270, R:90}, {n:'Öbür kol yukarı!', L:90, R:270}, {n:'A harfi ol!', L:135, R:45},
  {n:'Bir kol yana!', L:180, R:90}
];
const TOL = 35;
const wall = {
  title:'Şekil Duvarı', hint:'Duvardaki şekli kollarınla yap!',
  reset(){ this.last = -1; this.next(); },
  next(){
    let i; do { i = Math.random()*POSES.length | 0; } while(i === this.last);
    this.last = i; this.pose = POSES[i]; this.z = 0; this.lastMatch = -9; this.res = null;
    this.dur = 5.5 - Math.max(0, ROUND - timeLeft)/ROUND*1.5;
  },
  update(dt){
    const now = performance.now()/1000;
    this.mL = sig.armsOK && adiff(sig.aL, this.pose.L) < TOL;
    this.mR = sig.armsOK && adiff(sig.aR, this.pose.R) < TOL;
    if(this.mL && this.mR) this.lastMatch = now;
    if(this.res){ this.resT -= dt; if(this.resT <= 0) this.next(); return; }
    if(phase !== 'play') return;
    this.z += dt/this.dur;
    if(this.z >= 1){
      this.z = 1; this.resT = 1.3;
      if(now - this.lastMatch < .6){ this.res = 'ok'; score++; SND.good(); burst(W/2, H*.5, '#3ddc84', 30); float(W/2, H*.3, 'Süper!'); }
      else { this.res = 'no'; SND.hit(); float(W/2, H*.3, 'Olmadı, sıradaki!'); }
    }
  },
  holeFigure(cx, cy, u, col){
    const P2 = (x, y) => ({x:cx + x*u, y:cy + y*u}), lw = u*.3;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw;
    const ln = (a, b) => { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
    ln(P2(0, -.36), P2(0, .3)); ln(P2(-.14, -.36), P2(.14, -.36));
    ln(P2(-.1, .3), P2(-.24, .95)); ln(P2(.1, .3), P2(.24, .95));
    for(const [sx, a] of [[-.14, this.pose.L], [.14, this.pose.R]]){
      const r = a*Math.PI/180; ln(P2(sx, -.36), P2(sx + Math.cos(r)*.62, -.36 + Math.sin(r)*.62));
    }
    ctx.beginPath(); ctx.arc(cx, cy - .62*u, .2*u, 0, 7); ctx.fill();
  },
  draw(t){
    sky('#8fd8ff', '#e8f8ff');

    const floorY = H*.72;
    ctx.fillStyle = '#7fd36b'; ctx.fillRect(0, floorY, W, H - floorY);

    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(W/2, wy + wh, ww*.55, wh*.05, 0, 0, 7); ctx.fill();
    rrect(wx, wy, ww, wh, 10*s, this.res === 'ok' ? '#3ddc84' : '#e86a4a');
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2;
    const bh = wh/8;
    for(let r = 1; r < 8; r++){ ctx.beginPath(); ctx.moveTo(wx, wy + r*bh); ctx.lineTo(wx + ww, wy + r*bh); ctx.stroke(); }
    for(let r = 0; r < 8; r++) for(let c = 0; c < 6; c++){ const x = wx + (c + (r % 2)*.5)*ww/6; if(x > wx && x < wx + ww){ ctx.beginPath(); ctx.moveTo(x, wy + r*bh); ctx.lineTo(x, wy + (r + 1)*bh); ctx.stroke(); } }
    this.holeFigure(W/2, cy, full*s, '#bfe9ff');
    if(this.res === 'no'){ ctx.strokeStyle = '#1b2a4a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(wx + ww*.2, wy); ctx.lineTo(wx + ww*.35, wy + wh*.3); ctx.lineTo(wx + ww*.25, wy + wh*.5); ctx.moveTo(wx + ww*.8, wy + wh); ctx.lineTo(wx + ww*.7, wy + wh*.6); ctx.stroke(); }
    if(sOn){
      const k = (.28*full)/sig.sw;

    }

  }
};

  const b1 = {x:hc.x + ux*hr*.55 + px*hr*.7, y:hc.y + uy*hr*.55 + py*hr*.7};
  const b2 = {x:hc.x + ux*hr*.55 - px*hr*.7, y:hc.y + uy*hr*.55 - py*hr*.7};
  ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#1b2a4a'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(tl.bx, tl.by); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4d6bff';
  for(const [f, s] of [[.35, .25], [.55, -.2], [.75, .1]]){
    const x = hc.x + ux*hr*(.55 + 1.2*f) + px*hr*s*(1 - f), y = hc.y + uy*hr*(.55 + 1.2*f) + py*hr*s*(1 - f);
    ctx.beginPath(); ctx.arc(x, y, hr*.08, 0, 7); ctx.fill();
  }
}
function segDist(px, py, ax, ay, bx, by){
  const vx = bx - ax, vy = by - ay, l = vx*vx + vy*vy || 1;
  const k = Math.max(0, Math.min(1, ((px - ax)*vx + (py - ay)*vy)/l));
  return Math.hypot(px - ax - vx*k, py - ay - vy*k);
}

function drawBall(x, y, r, rot){
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x + r*.15, y + r*.2, r, r, 0, 0, 7); ctx.fill();
  circle(x, y, r, '#fff');
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#1b2a4a';
  const pent = (cx, cy, s) => { ctx.beginPath(); for(let i = 0; i < 5; i++){ const a = -Math.PI/2 + i*Math.PI*2/5; ctx.lineTo(cx + Math.cos(a)*s, cy + Math.sin(a)*s); } ctx.fill(); };
  pent(0, 0, r*.32);
  for(let i = 0; i < 5; i++){ const a = -Math.PI/2 + i*Math.PI*2/5; pent(Math.cos(a)*r*.78, Math.sin(a)*r*.78, r*.2); }
  ctx.restore();
  ctx.strokeStyle = '#1b2a4a'; ctx.lineWidth = Math.max(1.5, r*.05); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
}

}

    score += 1;
    if(this.combo === 3){ score += 2; float(f.x, f.y - f.r*1.6, 'Kombo +2!'); SND.good(); } else float(f.x, f.y - f.r*1.4, '+1');
    sfx(900, 250, .12, 'sawtooth', .08);
  },
  update(dt){
    const now = performance.now()/1000, g = H*1.1;
    this.sws = this.swords();
    for(const k of ['L', 'R', 'P']){
      const s = this.sws.find(x => x.key === k), tr = this.trails[k];
      if(s){ const l = tr[tr.length - 1]; if(!l || l.x !== s.tx || l.y !== s.ty) tr.push({x:s.tx, y:s.ty, mx:(s.bx + s.tx)/2, my:(s.by + s.ty)/2, t:now}); }
      else tr.length = 0;
      while(tr.length && now - tr[0].t > .25) tr.shift();
    }
    if(phase === 'play'){
      this.spawn -= dt;
      if(this.spawn <= 0){
        const prog = (ROUND - timeLeft)/ROUND, n = 1 + (Math.random() < .3 + prog*.3 ? 1 : 0) + (prog > .6 && Math.random() < .2 ? 1 : 0);
        for(let k = 0; k < n; k++){
          const t = FRUITS[Math.random()*FRUITS.length | 0], x = W*(.2 + Math.random()*.6);
          this.list.push({x, y:H + U, vx:(W/2 - x)*(.3 + Math.random()*.4), vy:-H*(1.1 + Math.random()*.25), r:U*.55*t.r, t, rot:Math.random()*6, spin:(Math.random() - .5)*4});
        }
        this.spawn = 1.4 - prog*.5 + Math.random()*.4;
      }
    }
    for(const f of [...this.list, ...this.halves]){ f.vy += g*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.spin*dt; if(f.half) f.life -= dt; }
    const minSp = Math.max(300, W*.35);
    if(phase === 'play') for(const k in this.trails){
      const tr = this.trails[k]; if(tr.length < 2) continue;
      const b = tr[tr.length - 1]; let a = tr[0];
      for(let j = tr.length - 2; j >= 0; j--){ a = tr[j]; if(b.t - a.t >= .06) break; }
      if(b.t - a.t < .01) continue;
      const sp = Math.hypot(b.x - a.x, b.y - a.y)/(b.t - a.t);
      if(sp < minSp) continue;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      for(const f of this.list) if(!f.cut && (segDist(f.x, f.y, a.x, a.y, b.x, b.y) < f.r || segDist(f.x, f.y, a.mx, a.my, b.mx, b.my) < f.r)) this.cutFruit(f, ang, now);
    }
    this.list = this.list.filter(f => !f.cut && !(f.vy > 0 && f.y > H + f.r*2));
    this.halves = this.halves.filter(f => f.life > 0 && f.y < H + f.r*3);
  },
  draw(t){
    sky('#d8a25e', '#8a5a2b');
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 3;
    for(let x = 0; x < W; x += Math.max(60, W/14)){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for(const [x, c] of [[W*.12, '#ff4f7a'], [W*.88, '#ffb627']]){
      bLimb({x, y:0}, {x, y:H*.1}, 2, '#1b2a4a'); ell(x, H*.17, U*.45, U*.6, c); rrect(x - U*.25, H*.17 - U*.66, U*.5, U*.1, 3, '#1b2a4a'); rrect(x - U*.25, H*.17 + U*.56, U*.5, U*.1, 3, '#1b2a4a');
    }
    for(const f of this.halves){ ctx.globalAlpha = Math.min(1, f.life); drawFruit(f); }
    ctx.globalAlpha = 1;
    for(const f of this.list) drawFruit(f);
    for(const k in this.trails){
      const tr = this.trails[k];
      for(let j = 1; j < tr.length; j++){ ctx.globalAlpha = j/tr.length*.7; bLimb(tr[j - 1], tr[j], 4 + j/tr.length*10, '#fff'); }
    }
    ctx.globalAlpha = 1;
    for(const s of this.sws) drawSword(s);
  }
};

/* ================= ÇERÇEVE ================= */
const GAMES = {balloon, dino, plat, wall, bird, dance, lion, keeper, fruit};
const NEED = {
  keeper: () => !sig.armsOK ? 'Kolların görünsün, biraz geri git' : '',
  fruit: () => !(ok(15, .35) || ok(16, .35)) ? 'Ellerini kaldır, kılıcını göster!' : '',
  balloon: () => bopt.ctrl === 'head' ? (!ok(0, .4) ? 'Yüzün kameraya dönük olsun' : '') : (!ok(19, .35) && !ok(20, .35) ? 'Ellerini kaldır, parmağını göster!' : ''),
  wall: () => !sig.armsOK ? 'Kolların görünsün, biraz geri git' : '',
  bird: () => !(ok(15, .4) && ok(16, .4)) ? 'Kolların görünsün, biraz geri git' : '',
  dance: () => !(ok(23, .4) && ok(24, .4)) ? 'Biraz geri git, tüm vücudun görünsün' : ''
};
let curKey = null, cur = null, phase = 'menu', score = 0, timeLeft = ROUND, countT = 0;
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawPreview(){
  if(!camOK || video.readyState < 2) return;
  const pw = Math.min(170, W*.2), ph = pw/asp, px = W - pw - 12, py = 70;
  ctx.save(); ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.clip();
  ctx.translate(px + pw, py); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, pw, ph); ctx.restore();
  if(sOn){
    ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for(const [a, b] of BONES) if(ok(a, .4) && ok(b, .4)){ ctx.beginPath(); ctx.moveTo(px + S[a].x/asp*pw, py + S[a].y*ph); ctx.lineTo(px + S[b].x/asp*pw, py + S[b].y*ph); ctx.stroke(); }
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 12); ctx.stroke();
}
function framing(){
  if(phase !== 'count' && phase !== 'play') return '';
  if(!camOK) return note2;
  if(!landmarker) return 'Hareket algılayıcı yükleniyor…';
  if(!sig.ok) return 'Kameranın önüne geç, seni göremiyorum!';
  return NEED[curKey] ? NEED[curKey]() : '';
}
let last = performance.now();
function loop(){
  const now = performance.now(), dt = Math.min(.05, (now - last)/1000), t = now/1000; last = now;
  detect(); smooth(); signals(dt);
  if(phase === 'count'){ countT -= dt; if(countT <= 0){ phase = 'play'; sig.calib = false; } }
  if(phase === 'play'){ timeLeft -= dt; if(timeLeft <= 0){ timeLeft = 0; endGame(); } }
  if(cur && phase !== 'menu') cur.update(dt);
  fx(dt);
  if(cur && phase !== 'menu') cur.draw(t);
  else { sky('#5ec8ff', '#d4f3ff'); clouds(t); }
  drawFx();
  if(phase === 'count' || phase === 'play') drawPreview();
  if(phase === 'count'){
    const n = Math.ceil(countT), f = countT % 1;
    outlined(String(n), W/2, H*.45, Math.round(Math.min(W, H)*.28*(1 + f*.3)), '#ffd23f');
    outlined(cur.hint, W/2, H*.45 + Math.min(W, H)*.22, Math.min(40, W*.055), '#fff');
  }
  $('score').textContent = cur && cur.hud && phase !== 'menu' ? cur.hud() : 'Puan: ' + score;
  $('time').textContent = Math.ceil(timeLeft);
  const m = framing(), el = $('msg'); el.hidden = !m; if(m) el.textContent = m;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function newRound(key){
  curKey = key; cur = GAMES[key];
  score = 0; timeLeft = cur.round || ROUND; parts = []; texts = [];
  sig.base = null; sig.calib = true;
  cur.reset();
  phase = 'count'; countT = 3;
  $('menu').hidden = true; $('over').hidden = true; $('hud').hidden = false;
}
function endGame(){
  phase = 'end'; music.stop();
  $('hud').hidden = true; $('over').hidden = false;
  $('result').textContent = cur.result ? cur.result() : `${cur.title}: ${score} puan!`;
  $('again').focus();
}
function toMenu(){ phase = 'menu'; music.stop(); $('hud').hidden = true; $('over').hidden = true; $('menu').hidden = false; }
async function start(key){
  const btns = document.querySelectorAll('.game'); btns.forEach(b => b.disabled = true);
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch(e){}
  if(!camOK){ try { await initCam(); } catch(e){ note2 = 'Kamera açılamadı, klavyeyle oynayabilirsin'; } }
  if(camOK && !landmarker){
    try { await initPose(); }
    catch(e){ camOK = false; note2 = 'Hareket algılayıcı yüklenemedi (internet?), klavyeyle oynayabilirsin'; }
  }
  btns.forEach(b => b.disabled = false);
  newRound(key);
}
document.querySelectorAll('.game[data-game]').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.game === 'balloon'){ $('menu').hidden = true; $('bopts').hidden = false; $('bstart').focus(); }
  else start(b.dataset.game);
}));
for(const [attr, key] of [['bmode','mode'], ['bctrl','ctrl'], ['bdiff','diff']]){
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.addEventListener('click', () => {
    bopt[key] = b.dataset[attr];
    document.querySelectorAll(`[data-${attr}]`).forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
}
$('bstart').addEventListener('click', () => { $('bopts').hidden = true; start('balloon'); });
$('bback').addEventListener('click', () => { $('bopts').hidden = true; $('menu').hidden = false; });
$('again').addEventListener('click', () => newRound(curKey));
$('back').addEventListener('click', toMenu);
$('toMenu').addEventListener('click', toMenu);
}
</script>
